<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamBox</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#0f0f0f;color:#fff}
button,input{font:inherit}
.top{height:64px;background:#0f0f0f;display:flex;align-items:center;gap:22px;padding:0 20px;position:sticky;top:0;z-index:10;border-bottom:1px solid #252525}
.logo{font-size:23px;font-weight:800;letter-spacing:-1px;white-space:nowrap}
.logo span{background:#f00;padding:5px 8px;border-radius:9px;margin-right:6px}
.search{display:flex;max-width:650px;flex:1;margin:auto}
.search input{width:100%;background:#121212;border:1px solid #333;color:#fff;padding:12px 18px;border-radius:24px 0 0 24px;outline:none}
.search button{width:65px;border:1px solid #333;border-left:0;background:#222;color:white;border-radius:0 24px 24px 0;cursor:pointer}
.avatar{width:34px;height:34px;border-radius:50%;background:#444;display:grid;place-items:center;font-weight:bold}
.layout{display:flex}
.side{width:230px;min-height:calc(100vh - 64px);padding:15px 12px;border-right:1px solid #222;position:fixed}
.side button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#eee;padding:12px 14px;border-radius:10px;cursor:pointer}
.side button:hover,.side button.active{background:#272727}
main{margin-left:230px;width:calc(100% - 230px);padding:24px}
.chips{display:flex;gap:10px;overflow:auto;margin-bottom:25px}
.chip{border:0;background:#272727;color:#fff;border-radius:9px;padding:9px 16px;white-space:nowrap;cursor:pointer}
.chip:first-child{background:#fff;color:#111}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:28px 18px}
.card{cursor:pointer}
.thumb{aspect-ratio:16/9;background:#222;border-radius:12px;overflow:hidden;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover}
.time{position:absolute;right:7px;bottom:7px;background:#000d;padding:3px 5px;border-radius:4px;font-size:12px}
.info{display:flex;gap:11px;padding-top:11px}
.mini{width:38px;height:38px;border-radius:50%;background:#333;display:grid;place-items:center;flex:none}
.title{font-weight:700;line-height:1.35}
.meta{font-size:13px;color:#aaa;margin-top:5px}
.playerPage{display:none}
.player{max-width:1050px;margin:auto}
.video{width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
.video iframe{width:100%;height:100%;border:0}
.back{border:0;background:#222;color:#fff;padding:10px 15px;border-radius:8px;cursor:pointer;margin-bottom:18px}
.watchTitle{font-size:22px;font-weight:700;margin:15px 0}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions button{background:#272727;color:#fff;border:0;border-radius:20px;padding:10px 16px;cursor:pointer}
.channel{display:flex;align-items:center;gap:12px;margin-top:18px;padding-bottom:18px;border-bottom:1px solid #333}
.bigAvatar{width:45px;height:45px;border-radius:50%;background:#555;display:grid;place-items:center;font-weight:bold}
.comments{margin-top:25px}
.comment{padding:15px 0;border-bottom:1px solid #252525}
@media(max-width:800px){
.side{width:72px;padding:12px 8px}
.side button{font-size:0;text-align:center}
.side button::first-letter{font-size:20px}
main{margin-left:72px;width:calc(100% - 72px);padding:16px}
.grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.top{gap:10px;padding:0 10px}.logo{font-size:17px}.search{max-width:none}
}
</style>
</head>
<body>

<header class="top">
  <div class="logo"><span>▶</span>StreamBox</div>
  <div class="search">
    <input id="search" placeholder="Search videos">
    <button onclick="searchVideos()">🔍</button>
  </div>
  <div class="avatar">E</div>
</header>

<div class="layout">
<aside class="side">
  <button class="active" onclick="showHome()">🏠 Home</button>
  <button onclick="filterCategory('Music')">🎵 Music</button>
  <button onclick="filterCategory('Gaming')">🎮 Gaming</button>
  <button onclick="filterCategory('Sports')">🏀 Sports</button>
  <button onclick="filterCategory('News')">📰 News</button>
  <button onclick="filterCategory('Tech')">💻 Tech</button>
  <hr style="border-color:#252525">
  <button>📺 Subscriptions</button>
  <button>🕘 History</button>
  <button>📋 Playlists</button>
  <button>❤️ Liked videos</button>
</aside>

<main id="home">
  <div class="chips">
    <button class="chip" onclick="showHome()">All</button>
    <button class="chip" onclick="filterCategory('Music')">Music</button>
    <button class="chip" onclick="filterCategory('Gaming')">Gaming</button>
    <button class="chip" onclick="filterCategory('Sports')">Sports</button>
    <button class="chip" onclick="filterCategory('Tech')">Technology</button>
  </div>
  <div class="grid" id="grid"></div>
</main>

<section class="playerPage" id="watch">
  <div class="player">
    <button class="back" onclick="showHome()">← Back</button>
    <div class="video"><iframe id="iframe" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>
    <div class="watchTitle" id="watchTitle"></div>
    <div class="actions">
      <button>👍 Like</button><button>↗ Share</button><button>💾 Save</button>
    </div>
    <div class="channel">
      <div class="bigAvatar">S</div>
      <div><b id="channelName"></b><div class="meta">Official channel</div></div>
      <button style="margin-left:auto;background:#fff;color:#111;border:0;border-radius:20px;padding:10px 18px;font-weight:bold">Subscribe</button>
    </div>
    <div class="comments">
      <h3>Comments</h3>
      <div class="comment"><b>Alex</b><br><span class="meta">This is awesome!</span></div>
      <div class="comment"><b>Jordan</b><br><span class="meta">Great video 🔥</span></div>
    </div>
  </div>
</section>
</div>

<script>
const videos=[
 {id:"dQw4w9WgXcQ",title:"Rick Astley - Never Gonna Give You Up",channel:"Rick Astley",views:"1.6B views",age:"15 years ago",cat:"Music",time:"3:33"},
 {id:"kJQP7kiw5Fk",title:"Luis Fonsi - Despacito ft. Daddy Yankee",channel:"Luis Fonsi",views:"8.7B views",age:"9 years ago",cat:"Music",time:"4:42"},
 {id:"9bZkp7q19f0",title:"PSY - GANGNAM STYLE",channel:"officialpsy",views:"5.5B views",age:"14 years ago",cat:"Music",time:"4:13"},
 {id:"3JZ_D3ELwOQ",title:"Mark Ronson - Uptown Funk ft. Bruno Mars",channel:"Mark Ronson",views:"5.3B views",age:"11 years ago",cat:"Music",time:"4:31"},
 {id:"M7lc1UVf-VE",title:"YouTube Player API Demo",channel:"YouTube",views:"12M views",age:"10 years ago",cat:"Tech",time:"1:00"},
 {id:"aqz-KE-bpKQ",title:"Big Buck Bunny - Animation",channel:"Blender",views:"20M views",age:"8 years ago",cat:"Gaming",time:"9:56"},
 {id:"ysz5S6PUM-U",title:"HTML, CSS and JavaScript Tutorial",channel:"Web Dev",views:"7.2M views",age:"4 years ago",cat:"Tech",time:"12:45"},
 {id:"L_jWHffIx5E",title:"Smash Mouth - All Star",channel:"Smash Mouth",views:"500M views",age:"15 years ago",cat:"Music",time:"3:21"}
];

function card(v){
 return `<article class="card" onclick="watch('${v.id}',${JSON.stringify(v.title)},${JSON.stringify(v.channel)})">
   <div class="thumb"><img src="https://i.ytimg.com/vi/${v.id}/hqdefault.jpg" onerror="this.src='https://placehold.co/640x360/222/fff?text=Video'"><span class="time">${v.time}</span></div>
   <div class="info"><div class="mini">▶</div><div><div class="title">${v.title}</div><div class="meta">${v.channel}<br>${v.views} • ${v.age}</div></div></div>
 </article>`;
}
function render(list=videos){document.getElementById("grid").innerHTML=list.map(card).join("")}
function watch(id,title,channel){
 document.getElementById("home").style.display="none";
 document.getElementById("watch").style.display="block";
 document.getElementById("iframe").src="https://www.youtube.com/embed/"+id+"?autoplay=1";
 document.getElementById("watchTitle").textContent=title;
 document.getElementById("channelName").textContent=channel;
 window.scrollTo(0,0);
}
function showHome(){
 document.getElementById("watch").style.display="none";
 document.getElementById("home").style.display="block";
 render(videos);
}
function filterCategory(cat){render(videos.filter(v=>v.cat===cat))}
function searchVideos(){
 const q=document.getElementById("search").value.toLowerCase().trim();
 render(q?videos.filter(v=>(v.title+" "+v.channel+" "+v.cat).toLowerCase().includes(q)):videos);
}
document.getElementById("search").addEventListener("keydown",e=>{if(e.key==="Enter")searchVideos()});
render();
</script>
</body>
</html>
