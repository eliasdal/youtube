<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StreamBox</title><link rel="stylesheet" href="style.css"></head><body>
<header class="top"><button class="menu" onclick="toggleSidebar()">☰</button><div class="logo"><span>▶</span>StreamBox</div><div class="search"><input id="search" placeholder="Search videos"><button onclick="searchVideos()">🔍</button></div><button class="uploadBtn" onclick="document.getElementById('fileInput').click()">＋ Upload</button><div class="avatar">S</div><input id="fileInput" type="file" accept="video/mp4,video/webm,video/ogg" hidden></header>
<div class="layout"><aside class="side" id="sidebar"><button class="active" onclick="showHome()">🏠 <span>Home</span></button><button onclick="filterCategory('Music')">🎵 <span>Music</span></button><button onclick="filterCategory('Gaming')">🎮 <span>Gaming</span></button><button onclick="filterCategory('Sports')">🏀 <span>Sports</span></button><button onclick="filterCategory('Tech')">💻 <span>Technology</span></button><button onclick="filterCategory('Education')">📚 <span>Education</span></button><button onclick="filterCategory('Entertainment')">🎬 <span>Entertainment</span></button><hr><button>📺 <span>Subscriptions</span></button><button>🕘 <span>History</span></button><button>📋 <span>Playlists</span></button><button>❤️ <span>Liked videos</span></button></aside>
<main id="home"><div class="chips"><button class="chip selected" onclick="showHome()">All</button><button class="chip" onclick="filterCategory('Music')">Music</button><button class="chip" onclick="filterCategory('Gaming')">Gaming</button><button class="chip" onclick="filterCategory('Sports')">Sports</button><button class="chip" onclick="filterCategory('Tech')">Technology</button><button class="chip" onclick="filterCategory('Education')">Education</button><button class="chip" onclick="filterCategory('Entertainment')">Entertainment</button></div><h2 id="pageTitle">Recommended</h2><div class="grid" id="grid"></div></main>
<section class="playerPage" id="watch"><div class="player"><button class="back" onclick="showHome()">← Back</button><div class="video"><video id="videoPlayer" controls playsinline preload="metadata"></video></div><div class="watchTitle" id="watchTitle"></div><div class="actions"><button onclick="likeVideo()">👍 <span id="likeCount">0</span></button><button onclick="shareVideo()">↗ Share</button><button onclick="saveVideo()">💾 Save</button></div><div class="channel"><div class="bigAvatar">S</div><div><b id="channelName"></b><div class="meta">StreamBox channel</div></div><button class="subscribe" onclick="this.textContent='Subscribed ✓'">Subscribe</button></div><div class="comments"><h3>Comments</h3><div class="comment"><b>Alex</b><br><span class="meta">This is awesome!</span></div><div class="comment"><b>Jordan</b><br><span class="meta">Great video 🔥</span></div></div></div></section></div><script src="script.js"></script></body></html>
