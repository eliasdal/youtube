<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamBox</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <div class="logo"><span>▶</span>StreamBox</div>
  <div class="search">
    <input id="search" placeholder="Search videos">
    <button onclick="searchVideos()">🔍</button>
  </div>
  <div class="avatar">E</div>
</header>

<div class="layout">
<aside class="side">
  <button class="active" onclick="showHome()">🏠 Home</button>
  <button onclick="filterCategory('Music')">🎵 Music</button>
  <button onclick="filterCategory('Gaming')">🎮 Gaming</button>
  <button onclick="filterCategory('Sports')">🏀 Sports</button>
  <button onclick="filterCategory('News')">📰 News</button>
  <button onclick="filterCategory('Tech')">💻 Tech</button>
  <hr>
  <button>📺 Subscriptions</button>
  <button>🕘 History</button>
  <button>📋 Playlists</button>
  <button>❤️ Liked videos</button>
</aside>

<main id="home">
  <div class="chips">
    <button class="chip" onclick="showHome()">All</button>
    <button class="chip" onclick="filterCategory('Music')">Music</button>
    <button class="chip" onclick="filterCategory('Gaming')">Gaming</button>
    <button class="chip" onclick="filterCategory('Sports')">Sports</button>
    <button class="chip" onclick="filterCategory('Tech')">Technology</button>
  </div>
  <div class="grid" id="grid"></div>
</main>

<section class="playerPage" id="watch">
  <div class="player">
    <button class="back" onclick="showHome()">← Back</button>
    <div class="video">
      <iframe id="iframe"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen></iframe>
    </div>
    <div class="watchTitle" id="watchTitle"></div>
    <div class="actions">
      <button>👍 Like</button>
      <button>↗ Share</button>
      <button>💾 Save</button>
    </div>
    <div class="channel">
      <div class="bigAvatar">S</div>
      <div>
        <b id="channelName"></b>
        <div class="meta">Official channel</div>
      </div>
      <button class="subscribe">Subscribe</button>
    </div>
    <div class="comments">
      <h3>Comments</h3>
      <div class="comment"><b>Alex</b><br><span class="meta">This is awesome!</span></div>
      <div class="comment"><b>Jordan</b><br><span class="meta">Great video 🔥</span></div>
    </div>
  </div>
</section>
</div>

<script src="script.js"></script>
</body>
</html>
